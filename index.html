let supaSession=null;
async function supaFetch(path, options={}){
  const headers=Object.assign({'apikey':SUPABASE_KEY,'Content-Type':'application/json'}, options.headers||{});
  if(supaSession?.access_token) headers.Authorization='Bearer '+supaSession.access_token;
  const r=await fetch(SUPABASE_URL+path,{...options,headers});
  const txt=await r.text(); let data=null; try{data=txt?JSON.parse(txt):null}catch(e){data=txt}
  if(!r.ok) throw new Error((data&&data.msg)||(data&&data.message)||(data&&data.error_description)||('Supabase '+r.status));
  return data;
}
async function supaSignIn(email,password){
  const data=await supaFetch('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});
  supaSession=data; localStorage.setItem('sf_supa_session',JSON.stringify(data)); return data;
}
async function supaSignUp(email,password,metadata){

}
async function cloudPlayerProfiles(){return await supaFetch('/rest/v1/player_profiles?select=profile_id,user_id,profile,updated_at');}
async function cloudPlayerProfile(profileId){
  const rows=await supaFetch('/rest/v1/player_profiles?select=profile_id,user_id,profile,updated_at&profile_id=eq.'+encodeURIComponent(profileId)+'&limit=1');
  return rows&&rows[0]||null;
}
async function cloudSavePlayerProfile(profileId, profile){
  if(!supaSession?.access_token || !supaSession?.user?.id) throw new Error('Sesión no válida. Vuelve a iniciar sesión.');
  const now=new Date().toISOString();
  const existing=await supaFetch('/rest/v1/player_profiles?select=profile_id&profile_id=eq.'+encodeURIComponent(profileId)+'&limit=1');
  if(existing && existing.length){
    return await supaFetch('/rest/v1/player_profiles?profile_id=eq.'+encodeURIComponent(profileId),{
      method:'PATCH',
      headers:{Prefer:'return=representation'},
      body:JSON.stringify({user_id:supaSession.user.id,profile,updated_at:now})
    });
  }
  return await supaFetch('/rest/v1/player_profiles',{
    method:'POST',
    headers:{Prefer:'return=representation'},
    body:JSON.stringify({profile_id:profileId,user_id:supaSession.user.id,profile,updated_at:now})
  });
}
async function syncCloudPlayerProfiles(){
  if(!supaSession?.access_token) return;
  try{
    const rows=await cloudPlayerProfiles();
    (rows||[]).forEach(r=>{
      const p=(db.players||[]).find(x=>x.id===r.profile_id);
      if(p && r.profile && typeof r.profile==='object') Object.assign(p,r.profile);
    });
    save();
  }catch(e){console.warn('No se pudieron sincronizar perfiles:',e.message)}
}
async function loadMyCloudPlayerProfile(){
  if(!user?.playerId||!supaSession?.access_token) return;
  const row=await cloudPlayerProfile(user.playerId);

    if(p) Object.assign(p,row.profile);
    save();
  }
}

window.requestClaim=function(playerId){
  let p=db.players.find(x=>x.id===playerId);if(!p)return;
  let m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modal-card"><div class="title">Reclamar a ${esc(p.firstName+' '+p.lastName)}</div><p class="muted">Crea una cuenta online y envía la solicitud. El administrador podrá verla desde cualquier dispositivo.</p><form id="claimForm" class="form"><label>Nombre legal<input class="input" name="legalName" required value="${esc(p.firstName+' '+p.lastName)}"></label><label>Fecha de nacimiento<input class="input" type="date" name="birthDate" required value="${esc(p.birthDate||'')}"></label><label>Email para tu cuenta<input class="input" type="email" name="email" required></label><label>Contraseña<input class="input" type="password" name="password" required minlength="6"></label><label class="muted" style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" name="consent" required style="width:auto;margin-top:4px"> Confirmo que soy la titular de este perfil y autorizo la revisión de la solicitud.</label><div class="actions"><button type="button" class="btn ghost" onclick="this.closest('.modal').remove()">Cancelar</button><button class="btn">Enviar solicitud</button></div></form></div>`;document.body.appendChild(m);
  m.querySelector('#claimForm').onsubmit=async e=>{e.preventDefault();let f=e.target,b=Object.fromEntries(new FormData(f));let btn=f.querySelector('button.btn:not(.ghost)');btn.disabled=true;btn.textContent='Enviando…';
    try{
      const su=await supaSignUp(b.email,b.password,{role:'player',player_id:p.id,name:p.firstName+' '+p.lastName});
      // Con confirmación de email activada, Supabase puede devolver user=null/uid=null aunque la cuenta se haya creado correctamente.
      // La solicitud puede crearse como anon gracias a la policy de INSERT; añadimos user_id solo si Supabase lo devuelve.
      const uid=su?.user?.id || null;
      const payload={player_name:p.firstName+' '+p.lastName,player_email:b.email,requested_profile_id:p.id,status:'pending',legal_name:b.legalName,birth_date:b.birthDate};
      if(uid) payload.user_id=uid;
      await cloudCreateRequest(payload);
      p.verification=Object.assign(verificationState(p),{status:'Pendiente',submittedAt:new Date().toISOString(),reviewedAt:'',legalName:b.legalName,birthDate:b.birthDate,email:b.email,notes:''});save();m.remove();toast('Solicitud enviada al administrador');
    }catch(err){btn.disabled=false;btn.textContent='Enviar solicitud';toast(err.message||'No se pudo enviar la solicitud')}
  }
}

  m.querySelector('#newPlayerForm').onsubmit=e=>{e.preventDefault();let f=e.target,b=Object.fromEntries(new FormData(f));if(db.users.some(u=>u.email===b.email))return toast('Ese email ya está registrado');let p={id:'p'+Date.now(),firstName:b.firstName,lastName:b.lastName,position:'',dominantFoot:'Desconocida',region:'',country:b.country||'España',currentClub:'',agency:'',status:'No disponible',economicExpectations:'',photo:'',videos:[],bio:'',history:[],birthDate:b.birthDate,verification:{status:'Pendiente',document:'',selfie:'',submittedAt:new Date().toISOString(),reviewedAt:'',clubConfirmed:false,legalName:b.firstName+' '+b.lastName,birthDate:b.birthDate,email:b.email,notes:''}};let doc=f.document.files[0],self=f.selfie.files[0],rd1=new FileReader(),rd2=new FileReader(),done=0;const finish=()=>{done++;if(done<2)return;p.verification.document=rd1.result;p.verification.selfie=rd2.result;db.players.push(p);db.users.push({id:'u'+Date.now(),email:b.email,password:b.password,name:p.firstName+' '+p.lastName,role:'player',playerId:p.id,active:true});save();m.remove();toast('Cuenta creada. Ya puedes entrar; tu identidad está pendiente de verificación.');login()};rd1.onload=finish;rd2.onload=finish;rd1.readAsDataURL(doc);rd2.readAsDataURL(self)}

function playerVerification(c){let p=db.players.find(x=>x.id===user.playerId);if(!p)return c.innerHTML='<div class="card empty">No hay un perfil de jugadora asociado.</div>';let v=verificationState(p);c.innerHTML=`<div class="title">Verificación de identidad</div><p class="muted">La verificación evita suplantaciones y permite distinguir perfiles reclamados de perfiles aún no verificados.</p><div class="card section"><div class="profile"><div class="avatar">${initials(p)}</div><div><b>${esc(p.firstName+' '+p.lastName)}</b><p class="muted">${esc(p.currentClub||'Sin club asignado')}</p>${verificationBadge(p)}</div></div></div><div class="grid cards"><div class="card"><b>1. Identidad</b><p class="muted">Documento oficial + selfie. Tus documentos no son visibles en el Mercado.</p>${v.document&&v.selfie?'<span class="pill green">Documentación aportada</span>':'<span class="pill gray">Pendiente de aportar</span>'}</div><div class="card"><b>2. Revisión</b><p class="muted">Un administrador revisa la documentación y aprueba o rechaza la identidad.</p><span class="pill ${v.status==='Verificada'?'green':v.status==='Pendiente'?'yellow':'gray'}">${esc(v.status)}</span></div><div class="card"><b>3. Club</b><p class="muted">El club puede confirmar que eres realmente jugadora de su plantilla.</p><span class="pill ${v.clubConfirmed?'green':'gray'}">${v.clubConfirmed?'Club confirmado':'Sin confirmar'}</span></div></div>${v.status!=='Verificada'?'<div class="card section"><b>¿Necesitas aportar o actualizar la documentación?</b><p class="muted">Puedes volver a enviar documento y selfie para que el administrador revise tu identidad.</p><button class="btn" onclick="resubmitVerification()">Enviar documentación</button></div>':'<div class="card section"><b>✓ Identidad verificada</b><p class="muted">Tu perfil ya puede mostrar el distintivo de identidad verificada.</p></div>'}`}

window.resubmitVerification=function(){let p=db.players.find(x=>x.id===user.playerId);if(!p)return;let m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modal-card"><div class="title">Enviar documentación</div><form id="verForm" class="form"><label>Documento de identidad<input class="input" type="file" name="document" accept="image/*,.pdf" required></label><label>Selfie de verificación<input class="input" type="file" name="selfie" accept="image/*" required></label><label class="muted" style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" required style="width:auto;margin-top:4px"> Confirmo que la documentación es mía y autorizo su revisión.</label><div class="actions"><button type="button" class="btn ghost" onclick="this.closest('.modal').remove()">Cancelar</button><button class="btn">Enviar</button></div></form></div>`;document.body.appendChild(m);m.querySelector('#verForm').onsubmit=e=>{e.preventDefault();let f=e.target,doc=f.document.files[0],self=f.selfie.files[0],r1=new FileReader(),r2=new FileReader(),done=0;const fin=()=>{done++;if(done<2)return;p.verification=Object.assign(verificationState(p),{status:'Pendiente',document:r1.result,selfie:r2.result,submittedAt:new Date().toISOString(),reviewedAt:'',notes:''});save();m.remove();show('verification');toast('Documentación enviada')};r1.onload=fin;r2.onload=fin;r1.readAsDataURL(doc);r2.readAsDataURL(self)}}

async function adminVerifications(c){
  c.innerHTML='<div class="title">Verificaciones</div><p class="muted">Solicitudes de perfiles y cambios pendientes.</p><div class="card empty">Cargando…</div>';
  try{
    const rows=await cloudAdminRequests();
    let changes=[];try{changes=await cloudProfileChangesPending()}catch(e){changes=[]}
    let html='<div class="title">Verificaciones</div><p class="muted">Solicitudes de perfiles y cambios pendientes.</p>';
    html+='<h3 style="margin-top:20px">Reclamaciones de perfil</h3>';
    if(rows.length){rows.forEach(r=>{
      const name=esc(r.player_name||'Sin nombre'), email=esc(r.player_email||''), status=r.status||'pending', pid=esc(r.requested_profile_id||''), legal=esc(r.legal_name||''), birth=esc(r.birth_date||'');
      const actions=status==='pending'?'<div class="actions"><button class="btn" onclick="approveCloudRequest(\''+r.id+'\')">✓ Aprobar solicitud</button><button class="btn danger" onclick="rejectCloudRequest(\''+r.id+'\')">Rechazar</button></div>':'<span class="pill '+(status==='approved'?'green':'gray')+'">'+esc(status)+'</span>';
      html+='<div class="card section"><div class="profile"><div class="avatar">'+esc((r.player_name||'').split(' ').map(x=>x[0]||'').slice(0,2).join('').toUpperCase())+'</div><div><b>'+name+'</b><p class="muted">'+email+'</p></div></div><div class="grid cards" style="margin-top:12px"><div class="card"><b>Perfil solicitado</b><p class="muted">'+pid+'</p></div><div class="card"><b>Nombre legal</b><p class="muted">'+legal+'</p></div><div class="card"><b>Fecha de nacimiento</b><p class="muted">'+birth+'</p></div></div><div class="actions">'+actions+'</div></div>';
    })}else html+='<div class="card empty">No hay solicitudes de perfil.</div>';
    html+='<h3 style="margin-top:26px">Cambios de equipo e historial</h3>';
    if(changes.length){changes.forEach(r=>{
      const p=db.players.find(x=>x.id===r.profile_id); const name=esc(p?(p.firstName+' '+p.lastName):(r.profile_id||'Jugadora')); let ch=r.changes||{}; if(typeof ch==='string'){try{ch=JSON.parse(ch)}catch(e){ch={}}}
      let parts=[]; if(Object.prototype.hasOwnProperty.call(ch,'currentClub')) parts.push('<div><b>Equipo actual solicitado:</b> '+esc(ch.currentClub||'Sin club')+'</div>');
      if(Object.prototype.hasOwnProperty.call(ch,'history')) parts.push('<div style="margin-top:8px"><b>Historial deportivo solicitado:</b><pre style="white-space:pre-wrap;margin:6px 0">'+esc(JSON.stringify(ch.history,null,2))+'</pre></div>');
      html+='<div class="card section"><div class="profile"><div class="avatar">'+esc(p?initials(p):'JG')+'</div><div><b>'+name+'</b><p class="muted">Cambio pendiente de validación</p></div></div><div class="card" style="margin-top:12px">'+parts.join('')+'</div><div class="actions"><button class="btn" onclick="approveProfileChange(\''+r.id+'\')">✓ Aprobar cambios</button><button class="btn danger" onclick="rejectProfileChange(\''+r.id+'\')">Rechazar</button></div></div>';
    })}else html+='<div class="card empty">No hay cambios pendientes.</div>';
    c.innerHTML=html;
  }catch(err){c.innerHTML='<div class="title">Verificaciones</div><div class="card empty">No se pudieron cargar las verificaciones: '+esc(err.message||'error')+'</div>'}
}
window.approveCloudRequest=async function(id){try{await cloudUpdateRequest(id,'approved');const rs=await supaFetch('/rest/v1/player_access_requests?select=requested_profile_id&status=eq.approved&id=eq.'+encodeURIComponent(id)+'&limit=1');const r=rs&&rs[0];if(r){const p=db.players.find(x=>x.id===r.requested_profile_id);const verification={status:'Verificada',reviewedAt:new Date().toISOString(),clubConfirmed:false};if(p){p.verification=verification;p.verifiedCurrentClub=p.currentClub||'';p.verifiedHistory=JSON.parse(JSON.stringify(p.history||[]));}try{const row=await cloudPlayerProfile(r.requested_profile_id);if(row){const merged=Object.assign({},row.profile||{},{verification,verifiedCurrentClub:(p&&p.currentClub)||row.profile?.currentClub||'',verifiedHistory:(p&&p.history)||row.profile?.history||[]});await supaFetch('/rest/v1/player_profiles?profile_id=eq.'+encodeURIComponent(r.requested_profile_id),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({profile:merged,updated_at:new Date().toISOString()})});}}catch(e){console.warn('No se pudo guardar la verificación online',e.message)}save()}toast('Solicitud aprobada · perfil verificado');show('verifications')}catch(e){toast(e.message||'No se pudo aprobar')}};
window.rejectCloudRequest=async function(id){try{await cloudUpdateRequest(id,'rejected');toast('Solicitud rechazada');show('verifications')}catch(e){toast(e.message||'No se pudo rechazar')}};
async function cloudProfileChangesPending(){return await supaFetch('/rest/v1/player_profile_change_requests?select=*&status=eq.pending&order=created_at.desc')}
async function cloudProfileChange(id,status){return await supaFetch('/rest/v1/player_profile_change_requests?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({status,reviewed_at:new Date().toISOString(),reviewed_by:supaSession.user.id})})}
window.approveProfileChange=async function(id){try{const rs=await supaFetch('/rest/v1/player_profile_change_requests?select=*&id=eq.'+encodeURIComponent(id)+'&limit=1');const r=rs&&rs[0];if(!r)throw new Error('No se encontró el cambio');let ch=r.changes;if(typeof ch==='string')ch=JSON.parse(ch);const row=await cloudPlayerProfile(r.profile_id);if(row){const merged=Object.assign({},row.profile||{},ch);await supaFetch('/rest/v1/player_profiles?profile_id=eq.'+encodeURIComponent(r.profile_id),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({profile:merged,updated_at:new Date().toISOString()})});}else{throw new Error('El perfil online de la jugadora todavía no existe')}await cloudProfileChange(id,'approved');const p=db.players.find(x=>x.id===r.profile_id);if(p){Object.assign(p,ch);if(Object.prototype.hasOwnProperty.call(ch,'currentClub'))p.verifiedCurrentClub=p.currentClub||'';if(Object.prototype.hasOwnProperty.call(ch,'history'))p.verifiedHistory=JSON.parse(JSON.stringify(p.history||[]));}save();toast('Cambios aprobados y publicados');show('verifications')}catch(e){toast(e.message||'No se pudieron aprobar los cambios')}};
window.rejectProfileChange=async function(id){try{await cloudProfileChange(id,'rejected');toast('Cambios rechazados');show('verifications')}catch(e){toast(e.message||'No se pudieron rechazar los cambios')}};
const _show=show;show=function(v){if(v==='verification'){setActive(v);let c=document.getElementById('content');if(c){c.innerHTML='<div class="loading">Cargando…</div>';requestAnimationFrame(()=>{try{playerVerification(c)}catch(err){console.error(err);c.innerHTML='<div class="card empty">No se pudo cargar la verificación.</div>'}})}return}if(v==='verifications'){setActive(v);let c=document.getElementById('content');if(c){c.innerHTML='<div class="loading">Cargando…</div>';requestAnimationFrame(()=>{try{adminVerifications(c)}catch(err){console.error(err);c.innerHTML='<div class="card empty">No se pudo cargar las verificaciones.</div>'}})}return}_show(v)};

function shell(){app.innerHTML='<div class="shell"><aside class="side"><div class="brand">Scout <span>Fem</span></div><div class="nav">'+menus[user.role].map(([id,t])=>`<button data-v="${id}">${t}</button>`).join('')+'</div><button class="nav logout" id="logout">Cerrar sesión</button></aside><main class="main"><header class="top"><b>Inicio</b></header><div class="content" id="content"></div></main></div>';document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>show(b.dataset.v));document.getElementById('logout').onclick=()=>{localStorage.removeItem('sf_user_demo');localStorage.removeItem('sf_supa_session');supaSession=null;user=null;login()}}
function render(){if(!user)return login();shell();show(menus[user.role][0][0])} function setActive(v){document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===v))}
function show(v){setActive(v);let c=document.getElementById('content');if(!c)return;c.innerHTML='<div class="loading">Cargando…</div>';requestAnimationFrame(()=>{try{if(v==='dashboard')dashboard(c);else if(v==='players'||v==='market')market(c);else if(v==='squad')squad(c);else if(v==='follow')follow(c);else if(v==='profile')profile(c);else if(v==='agency')agency(c);else if(v==='users')users(c);else if(v==='clubs')adminClubs(c);else if(v==='agencies')adminAgencies(c);else if(v==='representations')adminRepresentations(c);else if(v==='requests')playerRequests(c)}catch(err){console.error(err);c.innerHTML='<div class="card empty">No se pudo cargar esta sección. Vuelve a intentarlo.</div>'}})}
function dashboard(c){if(user.role==='club'){let club=db.clubs.find(x=>x.id===user.clubId),n=club?db.players.filter(p=>p.currentClub===club.name).length:0;if(club){c.innerHTML=`<div class="title">Inicio</div><div class="card" style="display:flex;align-items:center;gap:18px;margin-bottom:18px"><img src="${esc(club.logo||'')}" alt="Escudo ${esc(club.name)}" style="width:82px;height:82px;object-fit:contain;border-radius:14px;background:#fff;padding:6px" onerror="this.style.display='none'"><div><h2 style="margin:0 0 6px">${esc(club.name)}</h2><div class="muted">${esc(club.competition)} ${esc((club.season||'').replace('2026/27','26-27'))} ${esc(club.region||'Galicia')}</div></div></div><div class="grid stats"><div class="stat"><span class="muted">Mi plantilla</span><b>${n}</b></div><div class="stat"><span class="muted">Mercado</span><b>${db.players.length}</b></div><div class="stat"><span class="muted">Seguimientos</span><b>${db.follows.filter(x=>x.clubId===user.clubId).length}</b></div><div class="stat"><span class="muted">Categoría</span><b style="font-size:15px">${esc(club.category)}</b></div></div><div class="grid cards"><div class="card"><b>Mi plantilla</b><p class="muted">Gestiona las jugadoras de ${esc(club.name)}.</p></div><div class="card"><b>Mercado</b><p class="muted">Busca y sigue jugadoras.</p></div><div class="card"><b>Seguimiento</b><p class="muted">Consulta tus jugadoras de interés.</p></div></div>`;return}}c.innerHTML=`<div class="title">${user.role==='club'?'Inicio':'Dashboard'}</div><p class="muted">Bienvenido a Scout Fem.</p><div class="grid stats"><div class="stat"><span class="muted">Jugadoras</span><b>${db.players.length}</b></div><div class="stat"><span class="muted">Clubes</span><b>${db.clubs.length}</b></div><div class="stat"><span class="muted">Agencias</span><b>${db.agencies.length}</b></div><div class="stat"><span class="muted">Seguimientos</span><b>${db.follows.length}</b></div></div><div class="grid cards"><div class="card"><b>Base de datos</b><p class="muted">Mercado de jugadoras con los cuatro filtros iniciales.</p></div><div class="card"><b>Seguimiento</b><p class="muted">Guarda jugadoras de interés y notas privadas.</p></div><div class="card"><b>4 perfiles</b><p class="muted">Administrador, club, jugadora y agencia.</p></div></div>`}
function getFollowStore(){try{return JSON.parse(localStorage.getItem('sf_followed_v19')||'{}')}catch(e){return {}}}
function isFollowing(clubId,playerId){if(!clubId||!playerId)return false;return !!getFollowStore()[clubId+':'+playerId]}
function persistFollow(clubId,playerId,on){let st=getFollowStore(),k=clubId+':'+playerId;if(on)st[k]=true;else delete st[k];localStorage.setItem('sf_followed_v19',JSON.stringify(st))}
function syncFollowStoreFromDb(){let st=getFollowStore();(db.follows||[]).forEach(f=>{if(f.clubId&&f.playerId)st[f.clubId+':'+f.playerId]=true});localStorage.setItem('sf_followed_v19',JSON.stringify(st))}
syncFollowStoreFromDb();
function market(c){c.innerHTML=`<div class="title">${user.role==='admin'?'Jugadoras':'Mercado de jugadoras'}</div><p class="muted">${db.players.length} perfiles · Las jugadoras que sigues quedan destacadas.</p><div class="toolbar" id="marketFilters"><input class="input" id="q" placeholder="Buscar nombre…"><select id="position"><option value="">Todas las posiciones</option><option>Portera</option><option>Defensa</option><option>Central</option><option>Mediocentro</option><option>Extremo</option><option>Delantera</option></select><select id="foot"><option value="">Lateralidad</option><option>Diestra</option><option>Zurda</option><option>Ambas</option><option>Desconocida</option></select><select id="clubFilter"><option value="">Todos los clubes</option>${[...(db.clubs||[])].sort((a,b)=>(a.name||'').localeCompare(b.name||'','es')).map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join('')}</select><select id="region"><option value="">Todas las comunidades</option><option>Galicia</option><option>Asturias</option><option>Madrid</option><option>Andalucía</option><option>Cataluña</option></select><select id="country"><option value="">Todos los países</option><option>España</option><option>Portugal</option><option>Francia</option></select></div><div class="card table-wrap"><table class="table"><thead><tr><th>Jugadora</th><th>Posición</th><th>Pierna</th><th>Comunidad</th><th>País</th><th>Club</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>`;['q','position','foot','clubFilter','region','country'].forEach(x=>document.getElementById(x).oninput=draw);draw();function draw(){let q=document.getElementById('q').value.toLowerCase(),p=document.getElementById('position').value,f=document.getElementById('foot').value,cl=document.getElementById('clubFilter').value,r=document.getElementById('region').value,co=document.getElementById('country').value;let ps=db.players.filter(x=>(!q||(x.firstName+' '+x.lastName).toLowerCase().includes(q))&&(!p||x.position===p)&&(!f||x.dominantFoot===f)&&(!cl||x.currentClub===cl)&&(!r||x.region===r)&&(!co||x.country===co));let rows=document.getElementById('rows');if(!rows)return;rows.innerHTML=ps.length?ps.map(x=>{let followed=user.role==='club'&&isFollowing(user.clubId,x.id);return `<tr class="${followed?'sf-followed-row':''}" data-player-id="${esc(x.id)}"><td class="player-name">${esc(x.firstName+' '+x.lastName)} ${verificationBadge(x)} ${followed?'<span class="sf-followed-tag">★ SIGUIENDO</span>':''}</td><td>${esc(x.position)}</td><td>${esc(x.dominantFoot)}</td><td>${esc(x.region)}</td><td>${esc(x.country)}</td><td>${esc(x.currentClub||'')}</td><td><button class="btn secondary" onclick="openPlayer('${x.id}')">Ver ficha</button>${user.role==='admin'?` <button class="btn ghost" onclick="adminEditPlayer('${x.id}')">Editar</button> <button class="btn danger" onclick="deletePlayer('${x.id}')">Eliminar</button>`:''}</td></tr>`}).join(''):'<tr><td colspan="7" class="empty">No hay resultados.</td></tr>'}}
function squad(c){let club=db.clubs.find(x=>x.id===user.clubId),ps=db.players.filter(x=>x.currentClub===club.name);c.innerHTML=`<div class="title">Mi plantilla</div><p class="muted">${ps.length} jugadoras asignadas al club</p><div class="card table-wrap"><table class="table"><thead><tr><th>Jugadora</th><th>Posición</th><th>Pierna</th><th>Situación</th><th></th></tr></thead><tbody>${ps.map(x=>`<tr><td class="player-name">${esc(x.firstName+' '+x.lastName)} ${verificationBadge(x)}</td><td>${esc(x.position)}</td><td>${esc(x.dominantFoot)}</td><td>${esc(x.status)}</td><td><button class="btn secondary" onclick="openPlayer('${x.id}')">Ver ficha</button>${user.role==='admin'?` <button class="btn ghost" onclick="adminEditPlayer('${x.id}')">Editar</button> <button class="btn danger" onclick="deletePlayer('${x.id}')">Eliminar</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}

const CATEGORIES=['Liga F','Primera Federación','Segunda Federación','Tercera Federación'];
function categoryChecks(selected=[]){return CATEGORIES.map(c=>`<label class="check"><input type="checkbox" value="${esc(c)}" ${selected.includes(c)?'checked':''}> ${esc(c)}</label>`).join('')}
const SEASONS=Array.from({length:31},(_,i)=>`${2026-i}/${String(27-i).padStart(2,'0')}`);
function teamOptions(selected=''){let names=[...(db.clubs||[]).map(c=>c.name),...db.players.flatMap(p=>[p.currentClub,...(p.history||[]).map(h=>h.club)]),selected].filter(Boolean);return [...new Set(names)].sort().map(n=>`<option value="${esc(n)}" ${n===selected?'selected':''}>${esc(n)}</option>`).join('')}
function seasonOptions(selected=''){return SEASONS.map(y=>`<option value="${y}" ${y===selected?'selected':''}>${y}</option>`).join('')}
function historyRowHTML(h={}){let cats=h.categories||[h.category].filter(Boolean);return `<div class="history-row card"><div class="row"><label>Equipo<select class="hist-club">${teamOptions(h.club||'')}</select></label><label>Desde<select class="hist-from"><option value="">Año</option>${seasonOptions(h.from||'')}</select></label><label>Hasta<select class="hist-to"><option value="">Año</option>${seasonOptions(h.to||'')}</select></label></div><div><b>Categorías</b><div class="checks hist-categories">${categoryChecks(cats,h.club||'')}</div></div><button type="button" class="btn ghost hist-remove">Eliminar etapa</button></div>`}
function historyEditor(history=[]){let rows=history.length?history:[{club:'',from:'',to:'',categories:[]}];return `<div class="history-editor" id="historyEditor">${rows.map(historyRowHTML).join('')}</div><button type="button" class="btn ghost" id="addHistoryRow">+ Añadir etapa</button>`}
function readHistory(){return [...document.querySelectorAll('#historyEditor .history-row')].map(row=>({club:row.querySelector('.hist-club').value,from:row.querySelector('.hist-from').value,to:row.querySelector('.hist-to').value,categories:[...row.querySelectorAll('.checks input:checked')].map(x=>x.value)})).filter(h=>h.club&&h.categories.length)}
function wireHistoryEditor(){let box=document.getElementById('historyEditor');if(!box)return;box.querySelectorAll('.hist-remove').forEach(b=>b.onclick=()=>{let rows=box.querySelectorAll('.history-row');if(rows.length>1)b.closest('.history-row').remove();else b.closest('.history-row').outerHTML=historyRowHTML()});let add=document.getElementById('addHistoryRow');if(add)add.onclick=()=>{box.insertAdjacentHTML('beforeend',historyRowHTML());wireHistoryEditor()}}
window.openPlayer=id=>{let p=db.players.find(x=>x.id===id);if(!p)return;let m=document.createElement('div');m.className='modal';let followed=user.role==='club'&&db.follows.some(x=>x.clubId===user.clubId&&x.playerId===p.id);let age='';if(p.birthDate){let d=new Date(p.birthDate+'T00:00:00'),n=new Date();age=n.getFullYear()-d.getFullYear();let mm=n.getMonth()-d.getMonth();if(mm<0||(mm===0&&n.getDate()<d.getDate()))age--;}let club=db.clubs.find(x=>x.name===p.currentClub||x.id===p.currentClub);let agency=db.agencies.find(x=>x.name===p.agency||x.id===p.agency);let history=(p.history||[]).map(h=>`<div class="scout-history-item"><div><div class="scout-history-club">${esc(h.club)}</div><div class="scout-history-meta" style="text-align:left;margin-top:5px">${esc((h.categories||[]).join(' · '))}</div></div><div class="scout-history-meta">${esc([h.from,h.to].filter(Boolean).join(' – ')||'Temporada no indicada')}</div></div>`).join('');m.innerHTML=`<div class="modal-card scout-profile"><div class="scout-hero"><div class="scout-hero-photo">${p.photo?`<img src="${esc(p.photo)}">`:initials(p)}</div><div class="scout-hero-info"><div class="scout-kicker">Perfil de scouting</div><div class="scout-name">${esc(p.firstName+' '+p.lastName)} ${verificationBadge(p)}</div><div class="scout-sub">${esc(p.position)} · ${esc(p.dominantFoot)} · ${esc(p.region)}</div>${age!==''?`<span class="sf-age">${age} años</span>`:''} <span class="scout-status">${esc(p.status)}</span>${followed?'<div style="margin-top:10px"><span class="sf-followed-tag" style="font-size:12px;padding:6px 10px">★ SIGUIENDO</span></div>':''}</div></div><div class="scout-body"><div class="scout-stats"><div class="scout-stat"><small>Posición</small><b>${esc(p.position)}</b></div><div class="scout-stat"><small>Pierna dominante</small><b>${esc(p.dominantFoot)}</b></div><div class="scout-stat"><small>País</small><b>${esc(p.country)}</b></div><div class="scout-stat"><small>Fecha de nacimiento</small><b>${esc(window.sfFormatBirthDate ? ;b.textContent='☆ Seguir';let tag=m.querySelector('.sf-followed-tag');if(tag)tag.remove();toast('Jugadora quitada del seguimiento')}else{db.follows.push({id:'f'+Date.now(),clubId:user.clubId,playerId:p.id,status:'Interés',notes:''});persistFollow(user.clubId,p.id,true);b.textContent='✓ Siguiendo';let actions=m.querySelector('.scout-actions');if(actions&&!actions.querySelector('.sf-followed-tag')){let tag=document.createElement('span');tag.className='sf-followed-tag';tag.style='font-size:12px;padding:6px 10px;margin-left:8px';tag.textContent='★ SIGUIENDO';actions.insertBefore(tag,b)}toast('Jugadora añadida a seguimiento')}}};let r=m.querySelector('#req');if(r)r.onclick=()=>{if(!db.representationRequests.some(x=>x.agencyId===user.agencyId&&x.playerId===p.id&&x.status==='Pendiente')){db.representationRequests.push({id:'r'+Date.now(),agencyId:user.agencyId,playerId:p.id,status:'Pendiente'});save();r.disabled=true;r.textContent='Solicitud enviada';toast('Solicitud enviada a la jugadora')}else toast('Ya existe una solicitud pendiente')}};

tus">${['Disponible','Libre','Abierta a ofertas','No disponible'].map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select></label></div><label>Pretensiones económicas<input class="input" name="economicExpectations" value="${esc(p.economicExpectations||'')}"></label><label>Vídeos (una URL por línea)<textarea name="videos" rows="3">${esc((p.videos||[]).join('\n'))}</textarea></label><label>Sobre mí<textarea name="bio" rows="4">${esc(p.bio||'')}</textarea></label><button type="submit" class="btn">Guardar cambios</button></form></div>`;let file=document.getElementById('photoFile');file.onchange=()=>{let f=file.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{document.querySelector('#pf [name=photo]').value=rd.result;let av=document.getElementById('previewPhoto');if(av)av.src=rd.result};rd.readAsDataURL(f)};wireHistoryEditor();document.getElementById('pf').onsubmit=async e=>{e.preventDefault();const form=e.target;const btn=form.querySelector('button[type=submit]');if(btn){btn.disabled=true;btn.textContent='Guardando...'}try{let b=Object.fromEntries(new FormData(form));const nextProfile={firstName:b.firstName,lastName:b.lastName,birthDate:b.birthDate,position:b.position,dominantFoot:b.dominantFoot,region:b.region,country:b.country,currentClub:b.currentClub,history:readHistory(),status:b.status,economicExpectations:b.economicExpectations,photo:b.photo,videos:b.videos.split('\n').map(x=>x.trim()).filter(Boolean),bio:b.bio};await cloudSavePlayerProfile(p.id,nextProfile);Object.assign(p,nextProfile);user.name=p.firstName+' '+p.lastName;let lu=db.users.find(x=>x.id===user.id);if(lu)lu.name=user.name;localStorage.setItem('sf_user_demo',JSON.stringify(user));save();toast('Perfil guardado correctamente')}catch(err){toast('No se pudo guardar: '+(err.message||'error'))}finally{if(btn){btn.disabled=false;btn.textContent='Guardar cambios'}}}}

function adminRepresentations(c){let rs=db.representationRequests.map(r=>{let a=db.agencies.find(x=>x.id===r.agencyId),p=db.players.find(x=>x.id===r.playerId);return {...r,agency:a,player:p}});c.innerHTML=`<div class="title">Representaciones</div><p class="muted">El administrador puede aprobar una representación además de la aceptación de la jugadora.</p><div class="grid cards">${rs.map(r=>`<div class="card"><b>${esc(r.player?r.player.firstName+' '+r.player.lastName:'Jugadora')}</b><p class="muted">${esc(r.agency?r.agency.name:'Agencia')} · Estado: ${esc(r.status)}</p>${r.status==='Pendiente'?`<div class="actions"><button class="btn" onclick="adminAcceptReq('${r.id}')">Aceptar representación</button><button class="btn ghost" onclick="adminRejectReq('${r.id}')">Rechazar</button></div>`:''}</div>`).join('')||'<div class="card empty">No hay solicitudes.</div>'}</div>`}
window.adminAcceptReq=id=>{let r=db.representationRequests.find(x=>x.id===id),a=db.agencies.find(x=>x.id===r.agencyId),p=db.players.find(x=>x.id===r.playerId);if(!r||!a||!p)return;r.status='Aceptada por administrador';p.agency=a.name;save();show('representations');toast('Representación aceptada por el administrador')};window.adminRejectReq=id=>{let r=db.representationRequests.find(x=>x.id===id);if(!r)return;r.status='Rechazada por administrador';save();show('representations');toast('Solicitud rechazada')};
function adminAgencies(c){c.innerHTML=`<div class="title">Agencias</div><div class="card table-wrap"><table class="table"><thead><tr><th>Agencia</th><th>Contacto</th><th>Email</th><th></th></tr></thead><tbody>${db.agencies.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.contact)}</td><td>${esc(x.email)}</td><td><button class="btn secondary" onclick="editAgency('${x.id}')">Editar</button> <button class="btn danger" onclick="deleteAgency('${x.id}')">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`};window.editAgency=id=>{let x=db.agencies.find(a=>a.id===id);x.name=prompt('Nombre',x.name)||x.name;x.contact=prompt('Persona de contacto',x.contact)||x.contact;x.phone=prompt('Teléfono',x.phone)||x.phone;x.email=prompt('Email',x.email)||x.email;x.description=prompt('Descripción',x.description)||x.description;save();show('agencies')};window.deleteAgency=id=>{if(!confirm('¿Eliminar agencia?'))return;db.agencies=db.agencies.filter(x=>x.id!==id);db.players.forEach(p=>{if(p.agency===db.agencies.find(a=>a.id===id)?.name)p.agency=''});save();show('agencies')};
function users(c){c.innerHTML=`<div class="title">Usuarios</div><p class="muted">El administrador puede editar, activar/desactivar y eliminar accesos.</p><div class="card table-wrap"><table class="table"><thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Estado</th><th></th></tr></thead><tbody>${db.users.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td><span class="pill purple">${esc(x.role)}</span></td><td>${x.active?'Activo':'Inactivo'}</td><td><button class="btn secondary" onclick="editUser('${x.id}')">Editar</button> <button class="btn danger" onclick="deleteUser('${x.id}')">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`}
window.editUser=id=>{let x=db.users.find(u=>u.id===id);x.name=prompt('Nombre',x.name)||x.name;x.email=prompt('Email',x.email)||x.email;let pass=prompt('Contraseña',x.password);if(pass!==null&&pass!=='')x.password=pass;x.active=confirm('¿Usuario activo? Aceptar = activo, Cancelar = inactivo');save();show('users')};window.deleteUser=id=>{if(id===user.id){toast('No puedes eliminar tu propio usuario');return}if(!confirm('¿Eliminar este usuario?'))return;db.users=db.users.filter(x=>x.id!==id);save();show('users')};

render();
</script>
<script>
/* Scout Fem · validación de cambios de jugadora */
(function(){
  document.addEventListener('submit',async function(e){
    const form=e.target;
    if(!form || form.id!=='pf' || !window.user || user.role!=='player') return;
    e.preventDefault(); e.stopImmediatePropagation();
    const btn=form.querySelector('button[type=submit]'); if(btn){btn.disabled=true;btn.textContent='Guardando...'}
    try{
      const b=Object.fromEntries(new FormData(form));
      const p=db.players.find(x=>x.id===user.playerId); if(!p) throw new Error('No se encontró tu perfil');
      const history=readHistory();
      const verifiedClub=p.verifiedCurrentClub!==undefined ? p.verifiedCurrentClub : (p.currentClub||'');
      const verifiedHistory=p.verifiedHistory!==undefined ? p.verifiedHistory : (p.history||[]);
      const clubChanged=(b.currentClub||'')!==verifiedClub;
      const historyChanged=JSON.stringify(history)!==JSON.stringify(verifiedHistory);
      const changes={};
      if(clubChanged) changes.currentClub=b.currentClub||'';
      if(historyChanged) changes.history=history;
      // Los datos normales se guardan inmediatamente. Club e historial NO se publican hasta aprobación.
      const next={firstName:b.firstName,lastName:b.lastName,birthDate:b.birthDate,position:b.position,dominantFoot:b.dominantFoot,region:b.region,country:b.country,currentClub:p.currentClub||'',history:p.history||[],status:b.status,economicExpectations:b.economicExpectations,photo:b.photo,videos:(b.videos||'').split('\n').map(x=>x.trim()).filter(Boolean),bio:b.bio};
      await cloudSavePlayerProfile(p.id,next); Object.assign(p,next); save();
      if(Object.keys(changes).length){
        if(!supaSession?.user?.id) throw new Error('Sesión no válida. Vuelve a iniciar sesión.');
        const existing=await supaFetch('/rest/v1/player_profile_change_requests?select=id&profile_id=eq.'+encodeURIComponent(p.id)+'&user_id=eq.'+encodeURIComponent(supaSession.user.id)+'&status=eq.pending&limit=1');
        if(existing&&existing[0]){
          await supaFetch('/rest/v1/player_profile_change_requests?id=eq.'+encodeURIComponent(existing[0].id),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({changes})});
        }else{
          await supaFetch('/rest/v1/player_profile_change_requests',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({profile_id:p.id,user_id:supaSession.user.id,changes,status:'pending'})});
        }
        toast('Cambios enviados al administrador para validación');
      }else toast('Perfil guardado correctamente');
      show('profile');
    }catch(err){toast('No se pudo guardar: '+(err.message||'error'))}
    finally{if(btn){btn.disabled=false;btn.textContent='Guardar cambios'}}
  },true);
})();
</script>



<script id="sf-v113-persistence">
(function(){
  const KEY='scoutfem_demo_v1';
  function persistForm(form){
    try{
      const raw=localStorage.getItem(KEY); if(!raw)return;
      const db=JSON.parse(raw); const data=Object.fromEntries(new FormData(form));
      let p=null;
      if(form.id==='pf' && window.user && user.playerId) p=(db.players||[]).find(x=>x.id===user.playerId);
      if(form.id==='apf' && form.closest('.modal')){
        const title=form.closest('.modal').querySelector('.title')?.textContent||'';
        p=(db.players||[]).find(x=>(x.firstName+' '+x.lastName)===(title.replace('Editar jugadora','').trim()));
      }
      if(!p)return;
      Object.assign(p,{firstName:data.firstName||p.firstName,lastName:data.lastName||p.lastName,birthDate:data.birthDate||'',position:data.position||p.position,dominantFoot:data.dominantFoot||p.dominantFoot,region:data.region||p.region,country:data.country||p.country,currentClub:data.currentClub??p.currentClub,agency:data.agency??p.agency,status:data.status||p.status,economicExpectations:data.economicExpectations??p.economicExpectations,photo:data.photo??p.photo,videos:data.videos?p.videos.split('\n').map(x=>x.trim()).filter(Boolean):p.videos,bio:data.bio??p.bio});
      localStorage.setItem(KEY,JSON.stringify(db));
      return true;
    }catch(e){console.error(e);return false}
  }
  document.addEventListener('submit',function(e){
    const f=e.target;
    if(f && (f.id==='pf'||f.id==='apf')){
      setTimeout(function(){persistForm(f)},0);
    }
  },true);
})();
</script>

<script id="sf-v115-presentation">
(function(){
  window.sfFormatBirthDate = function(v){
    if(!v) return '';
    const str=String(v).trim();
    let m=str.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m) return `${m[3]}/${m[2]}/${m[1]}`;
    m=str.match(/^(\d{4})\/(\d{2})\/(\d{2})/);
    if(m) return `${m[3]}/${m[2]}/${m[1]}`;
    return str;
  };
  function formatDates(){
    document.querySelectorAll('[data-birth-date], .birth-date, .fecha-nacimiento').forEach(el=>{
      const raw=el.getAttribute('data-birth-date') || el.textContent.trim();
      const formatted=window.sfFormatBirthDate(raw);
      if(formatted && formatted!==raw) el.textContent=formatted;
    });
  }
  const st=document.createElement('style');
  st.textContent='.age-badge{display:inline-flex!important;align-items:center!important;visibility:visible!important;color:inherit!important;background:var(--surface-2,#f3f4f6)!important;border:1px solid var(--border,#d1d5db)!important;padding:6px 10px!important;border-radius:999px!important;font-weight:600!important;opacity:1!important;}';
  document.head.appendChild(st);
  const obs=new MutationObserver(formatDates);
  obs.observe(document.body,{childList:true,subtree:true});
  setTimeout(formatDates,100);
  setTimeout(formatDates,500);
})();
</script>

<script>
async function syncScoutFemVerificationFlags(){
  try{
    if(!supaSession?.access_token) return;
    if(user?.role==='admin'){
      const rows=await supaFetch('/rest/v1/player_access_requests?select=requested_profile_id,status&status=eq.approved');
      for(const r of (rows||[])){
        const p=db.players.find(x=>x.id===r.requested_profile_id);
        const verification=Object.assign({},p?.verification||{},{status:'Verificada',reviewedAt:(p?.verification?.reviewedAt)||new Date().toISOString()});
        if(p){
          p.verification=verification;
          if(!p.verifiedCurrentClub) p.verifiedCurrentClub=p.currentClub||'';
          if(!p.verifiedHistory) p.verifiedHistory=JSON.parse(JSON.stringify(p.history||[]));
        }
        try{
          const row=await cloudPlayerProfile(r.requested_profile_id);
          if(row){
            const merged=Object.assign({},row.profile||{},{verification,verifiedCurrentClub:(p&&p.currentClub)||row.profile?.currentClub||'',verifiedHistory:(p&&p.history)||row.profile?.history||[]});
            await supaFetch('/rest/v1/player_profiles?profile_id=eq.'+encodeURIComponent(r.requested_profile_id),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({profile:merged,updated_at:new Date().toISOString()})});
          }
        }catch(e){console.warn('No se pudo sincronizar la verificación online de '+r.requested_profile_id,e.message)}
      }
    }
    await syncCloudPlayerProfiles();
    save();
  }catch(e){console.warn('No se pudo sincronizar verificación',e.message)}
}
</script>
<script>setTimeout(async()=>{try{if(supaSession?.access_token && typeof user!=='undefined' && user){await syncScoutFemVerificationFlags();render();}}catch(e){console.warn('No se pudo ejecutar la sincronización de verificación',e.message)}},250);</script>
